name: Check checksums

# The atlas images are not in git, but the JSON/TSV files are. Make sure the
# tracked files still match the checksum manifest, so a metadata edit cannot
# land without the manifest (and therefore the next release) being updated.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tracked dataset files
        run: |
          set -euo pipefail
          git ls-files AtlasPack > tracked.txt
          awk 'NR == FNR { tracked[$0]; next }
               { path = $0; sub(/^[0-9a-f]+ [ *]/, "", path) }
               path in tracked' tracked.txt checksums/atlaspack.sha256 > tracked.sha256
          if [ "$(wc -l < tracked.sha256)" -ne "$(wc -l < tracked.txt)" ]; then
            echo "Some tracked files in AtlasPack/ are missing from checksums/atlaspack.sha256"
            exit 1
          fi
          sha256sum -c --quiet tracked.sha256
