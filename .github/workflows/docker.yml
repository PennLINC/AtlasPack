name: Build Docker image

# Builds pennlinc/atlaspack from the assets of a published GitHub release, so
# the image always contains exactly the released, checksummed data.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build (e.g. 0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - name: Download and verify release data
        run: scripts/fetch_data.sh "${VERSION}"

      - name: Stage data for the image
        run: cp -r AtlasPack docker_build/AtlasPack

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker_build
          push: true
          tags: |
            pennlinc/atlaspack:${{ env.VERSION }}
            pennlinc/atlaspack:latest
